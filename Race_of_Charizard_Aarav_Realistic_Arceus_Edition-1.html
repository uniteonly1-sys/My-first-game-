<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race of Charizard — Ultimate Visual Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            min-height: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #171027 0%, #06040a 72%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game-container {
            position: relative;
            width: min(100vw, 480px);
            height: min(133.333vw, 680px, 100dvh);
            aspect-ratio: 3 / 4;
            box-shadow: 0 14px 48px rgba(0, 0, 0, 0.8), 0 0 28px rgba(249, 115, 22, 0.24);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 20px;
            isolation: isolate;
            overflow: hidden;
            background: #000;
        }
        @media (max-height: 520px) and (orientation: landscape) {
            #game-container { width: auto; height: 100dvh; }
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }
        .btn {
            background: rgba(20, 15, 30, 0.85);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.4);
            padding: 9px 13px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .btn:hover:not(:disabled) {
            background: rgba(40, 30, 60, 0.95);
            border-color: #fbbf24;
            transform: scale(1.05);
        }
        .btn:disabled {
            opacity: .48;
            cursor: not-allowed;
            filter: saturate(.55);
        }
        .footer-hint {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.15px;
            background: rgba(0, 0, 0, 0.78);
            padding: 8px 13px;
            border-radius: 12px;
            margin: 0 auto 8px auto;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="canvas"></canvas>
        <div class="ui-layer">
            <div class="header-bar">
                <button id="soundBtn" class="btn">🔊 Sound: ON</button>
                <button id="diffBtn" class="btn" aria-label="Change difficulty">🎚 Difficulty: Medium</button>
            </div>
            <div class="footer-hint">Tap Screen or Press SPACE / UP Arrow</div>
        </div>
    </div>

    <script>
        // --- FAST SYNTHESIZED SOUND ENGINE ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playTone(freq, duration, type = 'sine', rampTo = null) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    if (rampTo) {
                        osc.frequency.exponentialRampToValueAtTime(rampTo, this.ctx.currentTime + duration);
                    }
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            jump() {
                this.playTone(210, 0.11, 'triangle', 520);
                setTimeout(() => this.playTone(620, 0.07, 'sine', 760), 35);
            }
            score() {
                this.playTone(660, 0.13, 'triangle', 990);
                setTimeout(() => this.playTone(880, 0.12, 'sine', 1180), 75);
            }
            hit() {
                this.playTone(190, 0.28, 'sawtooth', 45);
                setTimeout(() => this.playTone(95, 0.18, 'triangle', 35), 65);
            }
            splash() {
                this.playTone(420, 0.09, 'sine', 180);
            }
            milestone() {
                [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) =>
                    setTimeout(() => this.playTone(f, 0.28, 'sine'), i * 95));
            }
            arceus() { this.milestone(); }
            evolve() {
                this.playTone(150, 0.85, 'sawtooth', 950);
                setTimeout(() => this.milestone(), 250);
            }
        }

        const sound = new SoundEngine();

        // --- CANVAS SETUP ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const W = 360;
        const H = 480;
        const PIXEL_RATIO = Math.min(window.devicePixelRatio || 1, 3);
        canvas.width = Math.round(W * PIXEL_RATIO);
        canvas.height = Math.round(H * PIXEL_RATIO);
        ctx.setTransform(PIXEL_RATIO, 0, 0, PIXEL_RATIO, 0, 0);
        ctx.imageSmoothingEnabled = true;

        // --- GAME CONFIG & PHYSICS ---
        // Difficulty changes the vertical opening, not the game speed.
        // Medium keeps the previous Moderate speed; Easy widens the opening further.
        const MODES = {
            Easy:   { gravity: 0.14, jump: -3.8, maxFall: 4.2, speed: 1.8, gap: 225, interval: 110 },
            Medium: { gravity: 0.14, jump: -3.8, maxFall: 4.2, speed: 1.8, gap: 190, interval: 110 },
            High:   { gravity: 0.18, jump: -4.2, maxFall: 5.2, speed: 2.2, gap: 140, interval: 95 }
        };
        let currentMode = 'Medium';
        let cfg = MODES[currentMode];

        let state = 'START'; // START, PLAYING, CUTSCENE_20, COUNTDOWN, CUTSCENE_50, VICTORY, GAMEOVER
        let score = 0;
        let highScore = 0;
        try { highScore = parseInt(localStorage.getItem('charizard_arceus_hi') || '0', 10) || 0; } catch (e) { highScore = 0; }
        let frame = 0;
        const groundH = 45;

        // --- CUTSCENE STATE VARIABLES ---
        let cutsceneTimer = 0;
        let countdownVal = 3;
        let cosmicBgAlpha = 0;
        let speechText = "";
        let hasCrown = false;
        let isMegaEvolved = false;
        let megaStoneVisible = false;
        let whiteFlashAlpha = 0;

        // --- PARTICLE CONTAINERS ---
        let obstacles = [];
        let waterParticles = [];
        let fireEmbers = [];
        let cosmicParticles = [];

        // Pre-fill Embers
        for (let i = 0; i < 30; i++) {
            fireEmbers.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vy: Math.random() * 0.5 + 0.2,
                r: Math.random() * 2 + 1
            });
        }

        function spawnCosmicParticles() {
            if (cosmicParticles.length < 50) {
                cosmicParticles.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    r: Math.random() * 3 + 1,
                    hue: Math.floor(Math.random() * 360),
                    life: 1.0
                });
            }
        }

        // --- CHARIZARD OBJECT ---
        const charizard = {
            x: 75,
            y: H / 2,
            r: 16,
            vy: 0,
            rot: 0,
            wingPhase: 0,

            reset() {
                this.y = H / 2;
                this.vy = 0;
                this.rot = 0;
                this.wingPhase = 0;
            },
            flap() {
                this.vy = cfg.jump;
                sound.jump();
            },
            update() {
                this.vy += cfg.gravity;
                if (this.vy > cfg.maxFall) this.vy = cfg.maxFall;
                this.y += this.vy;
                this.rot = Math.min(Math.PI / 5, Math.max(-Math.PI / 6, this.vy * 0.07));
                this.wingPhase += 0.25;

                if (this.y - this.r <= 5) {
                    this.y = 5 + this.r;
                    this.vy = 0;
                }
            },
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                const mega = isMegaEvolved;
                const t = Date.now() * 0.001;
                const orange = mega ? '#172554' : '#e76520';
                const orangeLight = mega ? '#38bdf8' : '#ffad55';
                const belly = mega ? '#7dd3fc' : '#f6c58e';

                // Soft character glow and animated tail flame
                ctx.shadowColor = mega ? 'rgba(56,189,248,.75)' : 'rgba(249,115,22,.65)';
                ctx.shadowBlur = 13;
                const flameLen = 13 + Math.sin(t * 12) * 3;
                const flame = ctx.createLinearGradient(-33, 0, -13, 0);
                flame.addColorStop(0, '#fff7ae');
                flame.addColorStop(.35, mega ? '#38bdf8' : '#fb923c');
                flame.addColorStop(1, 'rgba(239,68,68,0)');
                ctx.fillStyle = flame;
                ctx.beginPath();
                ctx.moveTo(-13, 1);
                ctx.quadraticCurveTo(-23, -flameLen, -34, -3);
                ctx.quadraticCurveTo(-26, 7, -13, 3);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Tail, with a bright ridge
                ctx.fillStyle = mega ? '#172554' : '#c2410c';
                ctx.beginPath();
                ctx.moveTo(-10, 5); ctx.quadraticCurveTo(-22, 13, -28, 2);
                ctx.quadraticCurveTo(-20, -1, -12, -5); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = mega ? '#60a5fa' : '#fdba74';
                ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-14, 3); ctx.quadraticCurveTo(-22, 7, -26, 2); ctx.stroke();

                // Far wing: membrane, ribs and scalloped edge
                const wingBeat = Math.sin(this.wingPhase) * 7;
                ctx.fillStyle = mega ? '#1d4ed8' : '#0f766e';
                ctx.strokeStyle = mega ? '#93c5fd' : '#134e4a'; ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-4, -5); ctx.lineTo(-17, -27 + wingBeat);
                ctx.quadraticCurveTo(-15, -15 + wingBeat, -27, -18 + wingBeat);
                ctx.quadraticCurveTo(-22, -7, -13, 1); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = mega ? '#bfdbfe' : '#5eead4'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(-16, -23 + wingBeat);
                ctx.moveTo(-8, -2); ctx.lineTo(-25, -17 + wingBeat); ctx.stroke();

                // Back spikes
                ctx.fillStyle = mega ? '#dbeafe' : '#fed7aa';
                for (let i = 0; i < 3; i++) {
                    const sx = -8 + i * 7;
                    ctx.beginPath(); ctx.moveTo(sx, -9); ctx.lineTo(sx - 2, -16 - (i === 1 ? 2 : 0)); ctx.lineTo(sx + 4, -9); ctx.closePath(); ctx.fill();
                }

                // Body with shaded underside
                const bodyGrad = ctx.createLinearGradient(-8, -12, 10, 14);
                bodyGrad.addColorStop(0, mega ? '#60a5fa' : '#ff9a45');
                bodyGrad.addColorStop(.55, orange); bodyGrad.addColorStop(1, mega ? '#0f172a' : '#b93813');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath(); ctx.ellipse(0, 1, 16, 12, -.12, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = mega ? '#0c4a6e' : '#9a3412'; ctx.lineWidth = 1.2; ctx.stroke();

                // Belly plates
                ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(5, 4, 8, 8, -.2, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = mega ? '#0284c7' : '#c08457'; ctx.lineWidth = .8; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, 1); ctx.quadraticCurveTo(5, 3, 11, 2); ctx.moveTo(0, 6); ctx.quadraticCurveTo(5, 8, 10, 7); ctx.stroke();

                // Near wing, larger and layered
                ctx.fillStyle = mega ? '#2563eb' : '#0d9488';
                ctx.strokeStyle = mega ? '#bfdbfe' : '#99f6e4'; ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.moveTo(-2, -5); ctx.lineTo(-14, -24 - wingBeat);
                ctx.quadraticCurveTo(-9, -18 - wingBeat, -2, -20 - wingBeat);
                ctx.quadraticCurveTo(1, -12, 8, -7); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = mega ? '#dbeafe' : '#ccfbf1'; ctx.lineWidth = .9;
                ctx.beginPath(); ctx.moveTo(-1, -6); ctx.lineTo(-11, -21 - wingBeat); ctx.moveTo(1, -7); ctx.lineTo(-2, -19 - wingBeat); ctx.stroke();

                // Neck and head, facing right
                ctx.fillStyle = orange;
                ctx.beginPath(); ctx.moveTo(6, -7); ctx.quadraticCurveTo(12, -18, 20, -15);
                ctx.lineTo(23, -7); ctx.quadraticCurveTo(18, -1, 10, -1); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = mega ? '#0c4a6e' : '#9a3412'; ctx.lineWidth = 1; ctx.stroke();
                const headGrad = ctx.createLinearGradient(12, -22, 28, -5);
                headGrad.addColorStop(0, mega ? '#93c5fd' : '#ffb15e'); headGrad.addColorStop(1, orange);
                ctx.fillStyle = headGrad;
                ctx.beginPath(); ctx.ellipse(20, -15, 10, 8, -.12, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = mega ? '#1e40af' : '#9a3412'; ctx.stroke();

                // Snout, nostril and jaw
                ctx.fillStyle = orangeLight; ctx.beginPath(); ctx.ellipse(27, -11, 5, 3.5, .12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#7c2d12'; ctx.beginPath(); ctx.arc(28, -12, .8, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = mega ? '#bae6fd' : '#7c2d12'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(22, -7); ctx.quadraticCurveTo(27, -5, 31, -8); ctx.stroke();

                // Eye, brow and horns
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(22, -18, 3.2, 2.6, -.15, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = mega ? '#dc2626' : '#1e293b'; ctx.beginPath(); ctx.arc(23, -18, 1.35, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(18, -21); ctx.lineTo(24, -22); ctx.stroke();
                ctx.fillStyle = mega ? '#e0f2fe' : '#fef3c7';
                ctx.beginPath(); ctx.moveTo(14, -20); ctx.lineTo(12, -28); ctx.lineTo(19, -21); ctx.fill();
                ctx.beginPath(); ctx.moveTo(22, -21); ctx.lineTo(25, -27); ctx.lineTo(26, -18); ctx.fill();

                // Small shoulder scales and textured body highlights
                ctx.save();
                ctx.globalAlpha = mega ? .62 : .48;
                ctx.fillStyle = mega ? '#bfdbfe' : '#fed7aa';
                for (let i = 0; i < 5; i++) {
                    const sx = -7 + i * 4;
                    const sy = -3 + (i % 2) * 4;
                    ctx.beginPath(); ctx.ellipse(sx, sy, 1.25, .8, -.25, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();

                // Legs, toes and ivory claws
                ctx.fillStyle = orange;
                ctx.beginPath(); ctx.ellipse(-5, 10, 4.5, 5, -.25, 0, Math.PI * 2); ctx.ellipse(13, 8, 4, 4.5, .2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff7ed';
                for (const fx of [-8, -4, 12, 15]) {
                    ctx.beginPath(); ctx.moveTo(fx, 12); ctx.lineTo(fx + 1, 15); ctx.lineTo(fx + 2.5, 12); ctx.closePath(); ctx.fill();
                }

                // Tiny arms and claws
                ctx.fillStyle = orange; ctx.beginPath(); ctx.ellipse(8, 9, 5, 3, .35, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff7ed'; ctx.lineWidth = 1;
                for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(10 + i, 10); ctx.lineTo(12 + i, 12); ctx.stroke(); }

                // Mega Charizard X blue flame accents
                if (mega) {
                    ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 9; ctx.fillStyle = '#7dd3fc';
                    ctx.beginPath(); ctx.moveTo(27, -8); ctx.quadraticCurveTo(35, -12, 30, -3); ctx.quadraticCurveTo(29, 0, 25, -5); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(5, 11); ctx.quadraticCurveTo(0, 18, 10, 14); ctx.fill(); ctx.shadowBlur = 0;
                }
                if (hasCrown) {
                    ctx.fillStyle = '#fbbf24'; ctx.strokeStyle = '#92400e'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(14, -22); ctx.lineTo(15, -30); ctx.lineTo(20, -25); ctx.lineTo(25, -32); ctx.lineTo(27, -22); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(21, -24, 1.5, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
        };

        // --- ARCEUS OBJECT ---
        const arceus = {
            x: W / 2,
            y: -120,
            targetX: W / 2 + 50,
            targetY: 160,
            wheelAngle: 0,

            reset() {
                this.x = W / 2 + 40;
                this.y = -120;
            },
            update() {
                this.x += (this.targetX - this.x) * 0.015;
                this.y += (this.targetY - this.y) * 0.015 + Math.sin(Date.now() * 0.003) * 0.3;
                this.wheelAngle += 0.02;
            },
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y + Math.sin(Date.now() * .0022) * 1.5);
                ctx.scale(1.34, 1.34);
                const t = Date.now() * .001;
                const pulse = 1 + Math.sin(t * 2.1) * .035;

                // Soft layered celestial atmosphere behind Arceus.
                const aura = ctx.createRadialGradient(0, -9, 5, 0, -9, 91 * pulse);
                aura.addColorStop(0, 'rgba(255,255,255,.42)');
                aura.addColorStop(.28, 'rgba(253,230,138,.24)');
                aura.addColorStop(.58, 'rgba(125,211,252,.14)');
                aura.addColorStop(1, 'rgba(99,102,241,0)');
                ctx.fillStyle = aura;
                ctx.beginPath(); ctx.arc(0, -9, 91 * pulse, 0, Math.PI * 2); ctx.fill();

                // Fine rotating rays, kept subtle so the character stays readable.
                ctx.save(); ctx.translate(0, -8); ctx.rotate(-this.wheelAngle * .22);
                for (let i = 0; i < 28; i++) {
                    const a = i * Math.PI / 14;
                    ctx.strokeStyle = i % 2 ? 'rgba(255,245,190,.18)' : 'rgba(186,230,253,.19)';
                    ctx.lineWidth = i % 7 === 0 ? 1.8 : .8;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a) * 54, Math.sin(a) * 54);
                    ctx.lineTo(Math.cos(a) * (i % 7 === 0 ? 83 : 70), Math.sin(a) * (i % 7 === 0 ? 83 : 70));
                    ctx.stroke();
                }
                ctx.restore();

                // Arceus' iconic gold ring: an elliptical, sculpted metal frame.
                ctx.save(); ctx.translate(1, 3); ctx.rotate(-.08 + Math.sin(t * .6) * .025);
                ctx.shadowColor = 'rgba(250,204,21,.72)'; ctx.shadowBlur = 13;
                const gold = ctx.createLinearGradient(-49, -36, 49, 36);
                gold.addColorStop(0, '#fff9cf'); gold.addColorStop(.16, '#f8d45b');
                gold.addColorStop(.34, '#a66b12'); gold.addColorStop(.52, '#fff0a6');
                gold.addColorStop(.73, '#c18a22'); gold.addColorStop(1, '#fff4bd');
                ctx.strokeStyle = gold; ctx.lineWidth = 8;
                ctx.beginPath(); ctx.ellipse(0, 0, 43, 28, 0, 0, Math.PI * 2); ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,224,.9)'; ctx.lineWidth = 1.7;
                ctx.beginPath(); ctx.ellipse(0, 0, 38, 23, 0, 0, Math.PI * 2); ctx.stroke();
                ctx.strokeStyle = 'rgba(107,65,12,.85)'; ctx.lineWidth = 1.3;
                ctx.beginPath(); ctx.ellipse(0, 0, 48, 32, 0, 0, Math.PI * 2); ctx.stroke();
                const jewels = ['#46d17a','#51c7f4','#e879b8','#f9dc55','#a78bfa','#fb9b52','#2dd4bf','#77a9ff'];
                for (let i = 0; i < 8; i++) {
                    const a = i * Math.PI / 4 + this.wheelAngle * .18;
                    const x = Math.cos(a) * 43, y = Math.sin(a) * 28;
                    ctx.fillStyle = '#70420d'; ctx.beginPath(); ctx.arc(x, y, 5.2, 0, Math.PI * 2); ctx.fill();
                    const jg = ctx.createLinearGradient(x-3, y-4, x+3, y+4);
                    jg.addColorStop(0, '#fff'); jg.addColorStop(.28, jewels[i]); jg.addColorStop(1, '#26334a');
                    ctx.fillStyle = jg; ctx.beginPath(); ctx.moveTo(x, y-4.2); ctx.lineTo(x+3.8, y);
                    ctx.lineTo(x, y+4.2); ctx.lineTo(x-3.8, y); ctx.closePath(); ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = .7; ctx.stroke();
                }
                ctx.restore();

                // Pearl-white coat palette with cool shadow and warm reflected light.
                const coat = ctx.createLinearGradient(-35, -42, 35, 38);
                coat.addColorStop(0, '#ffffff'); coat.addColorStop(.22, '#f8fafc');
                coat.addColorStop(.48, '#e5e7eb'); coat.addColorStop(.72, '#cbd5e1');
                coat.addColorStop(.9, '#f1f5f9'); coat.addColorStop(1, '#9ca3af');
                const coatShadow = ctx.createLinearGradient(-20, -5, 25, 30);
                coatShadow.addColorStop(0, '#f8fafc'); coatShadow.addColorStop(1, '#aab5c3');

                // Grounded soft shadow beneath the hooves.
                ctx.save(); ctx.globalAlpha = .22; ctx.fillStyle = '#020617';
                ctx.beginPath(); ctx.ellipse(-1, 39, 35, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

                // Flowing tail behind the body, with individual pale strands.
                ctx.lineCap = 'round';
                const tailGrad = ctx.createLinearGradient(20, -2, 53, 17);
                tailGrad.addColorStop(0, '#dbe2ea'); tailGrad.addColorStop(.45, '#ffffff'); tailGrad.addColorStop(1, '#aab6c5');
                ctx.strokeStyle = tailGrad; ctx.lineWidth = 8;
                ctx.beginPath(); ctx.moveTo(20, 3); ctx.bezierCurveTo(34, -1, 36, 11, 51, 8); ctx.stroke();
                ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
                for (let i = 0; i < 4; i++) {
                    ctx.beginPath(); ctx.moveTo(26, 2+i*1.2); ctx.quadraticCurveTo(39, -5+i*3, 52, 5+i*2.3); ctx.stroke();
                }

                // Far legs: tapered, jointed horse legs with metallic fetlock guards.
                const leg = (x, y, lean, near) => {
                    ctx.save(); ctx.translate(x, y); ctx.rotate(lean);

        function spawnObstacle() {
            const minH = 40;
            const maxH = H - groundH - cfg.gap - minH;
            const topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;

            obstacles.push({
                x: W + 30,
                topH: topH,
                bottomY: topH + cfg.gap,
                passed: false
            });
        }

        // --- UPDATE GAME LOOP ---
        function update() {
            if (state === 'START') {
                charizard.y = H / 2 + Math.sin(Date.now() * 0.003) * 4;
                charizard.wingPhase += 0.12;
                return;
            }

            if (state === 'PLAYING') {
                charizard.update();

                frame++;
                if (frame % cfg.interval === 0) {
                    spawnObstacle();
                }

                // Generate Hydro Pump Water Particles
                obstacles.forEach(obs => {
                    if (Math.random() < 0.32 && waterParticles.length < 130) {
                        waterParticles.push({
                            x: obs.x + (Math.random() - 0.5) * 30,
                            y: obs.topH - Math.random() * 10,
                            vx: (Math.random() - 0.5) * 1.5,
                            vy: Math.random() * 2.5 + 1,
                            life: 1.0,
                            color: '#60a5fa'
                        });
                        waterParticles.push({
                            x: obs.x + (Math.random() - 0.5) * 30,
                            y: obs.bottomY + Math.random() * 10,
                            vx: (Math.random() - 0.5) * 1.5,
                            vy: -(Math.random() * 2.5 + 1),
                            life: 1.0,
                            color: '#93c5fd'
                        });
                    }
                });

                for (let p = waterParticles.length - 1; p >= 0; p--) {
                    const wp = waterParticles[p];
                    wp.x += wp.vx;
                    wp.y += wp.vy;
                    wp.life -= 0.04;
                    if (wp.life <= 0) waterParticles.splice(p, 1);
                }

                // Update Obstacles & Collision
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.x -= cfg.speed;

                    if (!obs.passed && obs.x < charizard.x) {
                        obs.passed = true;
                        score++;
                        sound.score();
                        for (let k = 0; k < 7; k++) cosmicParticles.push({ x: charizard.x, y: charizard.y, vx: (Math.random() - .5) * 2.8, vy: (Math.random() - .5) * 2.8, r: 1.5 + Math.random() * 2, hue: 35 + Math.random() * 35, life: .8 });

                        if (score > highScore) {
                            highScore = score;
                            try { localStorage.setItem('charizard_arceus_hi', String(highScore)); } catch (e) {}
                        }

                        // Milestone Cutscenes
                        if (score === 20) {
                            state = 'CUTSCENE_20';
                            cutsceneTimer = 0;
                            arceus.reset();
                            arceus.targetX = charizard.x + 80;
                            arceus.targetY = charizard.y - 10;
                            speechText = "";
                            sound.arceus();
                            return;
                        }

                        if (score === 50) {
                            state = 'CUTSCENE_50';
                            cutsceneTimer = 0;
                            arceus.reset();
                            arceus.targetX = charizard.x + 80;
                            arceus.targetY = charizard.y - 10;
                            speechText = "";
                            sound.arceus();
                            return;
                        }
                    }

                    // Collision Bounds
                    const bW = 34;
                    const tol = 3;
                    const hitX = (charizard.x + charizard.r - tol > obs.x - bW / 2) && 
                                 (charizard.x - charizard.r + tol < obs.x + bW / 2);
                    const hitTop = charizard.y - charizard.r + tol < obs.topH;
                    const hitBottom = charizard.y + charizard.r - tol > obs.bottomY;

                    if (hitX && (hitTop || hitBottom)) {
                        triggerGameOver();
                    }

                    if (obs.x < -50) obstacles.splice(i, 1);
                }

                if (charizard.y + charizard.r >= H - groundH) {
                    charizard.y = H - groundH - charizard.r;
                    triggerGameOver();
                }
            }
            else if (state === 'CUTSCENE_20') {
                cutsceneTimer++;
                cosmicBgAlpha = Math.min(1, cosmicBgAlpha + 0.02);
                arceus.update();
                spawnCosmicParticles();

                if (cutsceneTimer > 300) {
                    speechText = "Well done! Keep it up. I will meet you at 50.";
                }

                if (cutsceneTimer > 580) {
                    state = 'COUNTDOWN';
                    countdownVal = 3;
                    cutsceneTimer = 0;
                }
            }
            else if (state === 'COUNTDOWN') {
                cutsceneTimer++;
                cosmicBgAlpha = Math.max(0, cosmicBgAlpha - 0.05);

                if (cutsceneTimer % 45 === 0) {
                    countdownVal--;
                    if (countdownVal <= 0) {
                        state = 'PLAYING';
                    }
                }
            }
            else if (state === 'CUTSCENE_50') {
                cutsceneTimer++;
                cosmicBgAlpha = Math.min(1, cosmicBgAlpha + 0.02);
                arceus.update();
                spawnCosmicParticles();

                if (cutsceneTimer > 260) {
                    speechText = "Whoa, Champion! You won!";
                }
                if (cutsceneTimer > 400) {
                    hasCrown = true;
                }
                if (cutsceneTimer > 520) {
                    megaStoneVisible = true;
                }
                if (cutsceneTimer === 640) {
                    sound.evolve();
                    whiteFlashAlpha = 1.0;
                    isMegaEvolved = true;
                    speechText = "Thanks!";
                }
                if (whiteFlashAlpha > 0) {
                    whiteFlashAlpha -= 0.025;
                }
                if (cutsceneTimer > 780) {
                    state = 'VICTORY';
                }
            }
        }

        function triggerGameOver() {
            if (state !== 'GAMEOVER') {
                state = 'GAMEOVER';
                sound.hit();
            }
        }

            const maxWidth = 218;

            const lineHeight = 17;
            ctx.save();
            ctx.font = '600 12px Segoe UI, Arial, sans-serif';
            const words = message.split(/\s+/);
            const lines = [];
            let line = '';
            for (const word of words) {
                const test = line ? line + ' ' + word : word;
                if (ctx.measureText(test).width > maxWidth - paddingX * 2 && line) {
                    lines.push(line);
                    line = word;
                } else line = test;
            }
            if (line) lines.push(line);
            const boxW = maxWidth;
            const boxH = Math.max(43, lines.length * lineHeight + 18);
            const boxX = Math.max(9, Math.min(W - boxW - 9, anchorX - boxW / 2));
            const boxY = Math.max(58, Math.min(H - boxH - 58, anchorY - boxH - 43));
            ctx.shadowColor = 'rgba(0,0,0,0.45)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#fffdf7';
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxW, boxH, 11);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.fillStyle = '#24153f';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '600 12px Segoe UI, Arial, sans-serif';
            lines.forEach((part, i) => ctx.fillText(part, boxX + boxW / 2, boxY + 11 + lineHeight * (i + 0.5)));
            ctx.restore();
        }

        function drawRainbowCreatorCredit(y, fontSize = 18) {
            ctx.save();
            const width = 154;
            const gradient = ctx.createLinearGradient(W/2-width/2, 0, W/2+width/2, 0);
            gradient.addColorStop(0, '#ff3b30'); gradient.addColorStop(.16, '#ff9500');
            gradient.addColorStop(.32, '#ffd60a'); gradient.addColorStop(.49, '#30d158');
            gradient.addColorStop(.66, '#00c7ff'); gradient.addColorStop(.83, '#5856d6');
            gradient.addColorStop(1, '#ff2d95');
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = `900 ${fontSize}px Segoe UI, sans-serif`;
            ctx.lineJoin = 'round'; ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(8,7,20,.92)';
            ctx.shadowColor = 'rgba(255,255,255,.65)'; ctx.shadowBlur = 11;
            ctx.strokeText('Made by Aarav', W/2, y);
            ctx.fillStyle = gradient; ctx.fillText('Made by Aarav', W/2, y);
            ctx.shadowBlur = 0;
            // Small rainbow underline for a finished title-screen treatment.
            const line = ctx.createLinearGradient(W/2-58,0,W/2+58,0);
            line.addColorStop(0,'#ff3b30'); line.addColorStop(.2,'#ffd60a');
            line.addColorStop(.4,'#30d158'); line.addColorStop(.6,'#00c7ff');
            line.addColorStop(.8,'#5856d6'); line.addColorStop(1,'#ff2d95');
            ctx.strokeStyle = line; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(W/2-58,y+13); ctx.lineTo(W/2+58,y+13); ctx.stroke();
            ctx.restore();
        }

        // --- RENDER GAME CANVAS ---
        function render() {
            // Sunset Sky Background
            const sg = ctx.createLinearGradient(0, 0, 0, H);
            sg.addColorStop(0, '#0f172a');
            sg.addColorStop(0.4, '#451a03');
            sg.addColorStop(0.7, '#7c2d12');
            sg.addColorStop(1, '#18181b');
            ctx.fillStyle = sg;
            ctx.fillRect(0, 0, W, H);

            // Glowing volcanic sunset and soft atmospheric light
            const sunPulse = 1 + Math.sin(Date.now() * .0012) * .025;
            const sunGlow = ctx.createRadialGradient(276, 192, 7, 276, 192, 112 * sunPulse);
            sunGlow.addColorStop(0, 'rgba(255,214,145,.42)');
            sunGlow.addColorStop(.28, 'rgba(251,146,60,.16)');
            sunGlow.addColorStop(1, 'rgba(251,146,60,0)');
            ctx.fillStyle = sunGlow;
            ctx.fillRect(150, 65, 210, 255);
            ctx.save();
            ctx.globalAlpha = .18;
            ctx.fillStyle = '#fed7aa';
            ctx.beginPath(); ctx.arc(276, 192, 24 * sunPulse, 0, Math.PI * 2); ctx.fill();
            ctx.restore();

            // Slow, layered cloud wisps add depth without affecting gameplay speed
            const cloudShift = (Date.now() * .006) % 430;
            for (let c = 0; c < 4; c++) {
                const cx = ((c * 112 - cloudShift + 430) % 430) - 35;
                const cy = 105 + (c % 2) * 48;
                ctx.save();
                ctx.globalAlpha = .075;
                ctx.fillStyle = c % 2 ? '#cbd5e1' : '#fdba74';
                ctx.beginPath();
                ctx.ellipse(cx, cy, 29, 5, -.04, 0, Math.PI * 2);
                ctx.ellipse(cx + 17, cy - 3, 19, 6, .03, 0, Math.PI * 2);
                ctx.ellipse(cx - 15, cy + 1, 16, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Distant stars, drifting clouds and layered volcanic scenery
            for (let i = 0; i < 34; i++) {
                const sx = (i * 83 + 19) % W;
                const sy = (i * 47 + 23) % 205;
                const twinkle = .35 + .45 * (0.5 + 0.5 * Math.sin(Date.now() * .002 + i));
                ctx.globalAlpha = twinkle;
                ctx.fillStyle = i % 4 === 0 ? '#fde68a' : '#e0e7ff';
                ctx.beginPath(); ctx.arc(sx, sy, i % 5 === 0 ? 1.5 : .8, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.fillStyle = 'rgba(30,41,59,.55)';
            ctx.beginPath(); ctx.moveTo(0, 300); ctx.quadraticCurveTo(65, 245, 125, 302); ctx.quadraticCurveTo(205, 235, 280, 294); ctx.lineTo(W, 345); ctx.lineTo(0, 345); ctx.fill();

            // Distant twinkling stars for extra depth
            for (let i = 0; i < 22; i++) {
                const sx = (i * 67 + 19) % W, sy = (i * 43 + 27) % 235;
                ctx.globalAlpha = 0.35 + 0.35 * Math.sin(Date.now() * 0.0018 + i * 1.7);
                ctx.fillStyle = i % 4 === 0 ? '#fde68a' : '#dbeafe';
                ctx.beginPath(); ctx.arc(sx, sy, i % 5 === 0 ? 1.25 : 0.7, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Layered volcanic mountain range with glowing lava seams.
            const ridgeFar = ctx.createLinearGradient(0, 235, 0, H-groundH);
            ridgeFar.addColorStop(0, '#475569'); ridgeFar.addColorStop(1, '#1e293b');
            ctx.fillStyle = ridgeFar;
            ctx.beginPath(); ctx.moveTo(-12, H-groundH); ctx.lineTo(42, 300);
            ctx.lineTo(82, 326); ctx.lineTo(132, 278); ctx.lineTo(185, 326);
            ctx.lineTo(236, 288); ctx.lineTo(292, 326); ctx.lineTo(372, 282);
            ctx.lineTo(372, H-groundH); ctx.closePath(); ctx.fill();

            const ridgeNear = ctx.createLinearGradient(0, 270, 0, H-groundH);
            ridgeNear.addColorStop(0, '#3f3434'); ridgeNear.addColorStop(.55, '#292524'); ridgeNear.addColorStop(1, '#171717');
            ctx.fillStyle = ridgeNear;
            ctx.beginPath(); ctx.moveTo(-10, H-groundH); ctx.lineTo(60, H-groundH-100);
            ctx.lineTo(91, H-groundH-58); ctx.lineTo(140, H-groundH); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(90, H-groundH); ctx.lineTo(210, H-groundH-140);
            ctx.lineTo(248, H-groundH-91); ctx.lineTo(330, H-groundH); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(251,146,60,.38)'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(207, 343); ctx.lineTo(214, 358); ctx.lineTo(208, 369);
            ctx.moveTo(61, 379); ctx.lineTo(67, 390); ctx.lineTo(63, 400); ctx.stroke();

            // Ember Particles
            ctx.fillStyle = 'rgba(249, 115, 22, 0.8)';
            fireEmbers.forEach(e => {
                e.y -= e.vy;
                if (e.y < 0) e.y = H;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // Fierce Cosmic Background Overlay
            if (cosmicBgAlpha > 0) {
                ctx.fillStyle = `rgba(10, 2, 22, ${cosmicBgAlpha * 0.92})`;
                ctx.fillRect(0, 0, W, H);

                cosmicParticles.forEach((cp, idx) => {
                    cp.x += cp.vx;
                    cp.y += cp.vy;
                    cp.life -= 0.015;
                    ctx.fillStyle = `hsl(${cp.hue}, 90%, 70%)`;
                    ctx.globalAlpha = cp.life * cosmicBgAlpha;
                    ctx.beginPath();
                    ctx.arc(cp.x, cp.y, cp.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                    if (cp.life <= 0) cosmicParticles.splice(idx, 1);
                });
            }

            // Draw Blastoise & Hydro Pump Streams
            const bW = 40;
            obstacles.forEach(obs => {
                // Top Stream
                const wg = ctx.createLinearGradient(obs.x - bW/2, 0, obs.x + bW/2, 0);
                wg.addColorStop(0, 'rgba(29, 78, 216, 0.9)');
                wg.addColorStop(0.3, 'rgba(147, 197, 253, 0.95)');
                wg.addColorStop(0.7, 'rgba(59, 130, 246, 0.95)');
                wg.addColorStop(1, 'rgba(30, 64, 175, 0.9)');
                ctx.fillStyle = wg;
                ctx.fillRect(obs.x - bW/2, 0, bW, obs.topH);
                // Glassy flowing-water highlights and small current lines
                ctx.save();
                ctx.globalAlpha = .42;
                ctx.strokeStyle = '#dbeafe'; ctx.lineWidth = 1.2;
                for (let k = 0; k < 4; k++) {
                    const yy = (Date.now() * .055 + k * 29) % Math.max(1, obs.topH - 8);
                    ctx.beginPath(); ctx.moveTo(obs.x - 15, yy); ctx.quadraticCurveTo(obs.x, yy - 3, obs.x + 14, yy + 1); ctx.stroke();
                }
                ctx.restore();

                drawBlastoiseSprite(obs.x, obs.topH - 22, true);

                // Bottom Stream
                ctx.fillRect(obs.x - bW/2, obs.bottomY, bW, H - groundH - obs.bottomY);
                ctx.save();
                ctx.globalAlpha = .42;
                ctx.strokeStyle = '#eff6ff'; ctx.lineWidth = 1.2;
                for (let k = 0; k < 4; k++) {
                    const yy = obs.bottomY + ((Date.now() * .055 + k * 29) % Math.max(1, H - groundH - obs.bottomY - 5));
                    ctx.beginPath(); ctx.moveTo(obs.x - 14, yy); ctx.quadraticCurveTo(obs.x, yy + 3, obs.x + 15, yy - 1); ctx.stroke();
                }
                ctx.restore();
                drawBlastoiseSprite(obs.x, obs.bottomY + 22, false);
            });

            waterParticles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });

            // Draw Charizard
            charizard.draw();

            // Ground Bar
            ctx.fillStyle = '#18181b';
            ctx.fillRect(0, H - groundH, W, groundH);
            const groundGrad = ctx.createLinearGradient(0, H - groundH, 0, H);
            groundGrad.addColorStop(0, '#7f1d1d'); groundGrad.addColorStop(.18, '#292524'); groundGrad.addColorStop(1, '#09090b');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, H - groundH, W, groundH);
            ctx.fillStyle = '#fb923c';
            ctx.fillRect(0, H - groundH, W, 3);
            // Small glowing lava cracks
            ctx.strokeStyle = 'rgba(251,146,60,.55)'; ctx.lineWidth = 1;
            for (let i = 0; i < 12; i++) {
                const gx = (i * 37 + frame * (state === 'PLAYING' ? -cfg.speed : -.25)) % (W + 24);
                ctx.beginPath(); ctx.moveTo(gx, H - 25); ctx.lineTo(gx + 4, H - 20); ctx.lineTo(gx - 1, H - 15); ctx.stroke();
            }
            // Tiny obsidian stones and warm reflective flecks
            for (let i = 0; i < 18; i++) {
                const rx = (i * 61 + 13) % W;
                const ry = H - 9 - (i % 3) * 7;
                ctx.fillStyle = i % 3 === 0 ? 'rgba(253,186,116,.72)' : 'rgba(148,163,184,.32)';
                ctx.beginPath(); ctx.ellipse(rx, ry, i % 4 === 0 ? 2.2 : 1.2, .8, -.2, 0, Math.PI * 2); ctx.fill();
            }

            // Cutscene UI & Speech Bubbles
            if (state === 'CUTSCENE_20' || state === 'CUTSCENE_50') {
                arceus.draw();

                if (megaStoneVisible && !isMegaEvolved) {
                    drawMegaStone(charizard.x + 35, charizard.y - 10);
                }

                if (speechText.length > 0) {
                    drawSpeechBubble(speechText, arceus.x, arceus.y - 35);
                }

                if (whiteFlashAlpha > 0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${whiteFlashAlpha})`;
                    ctx.fillRect(0, 0, W, H);
                }
            }
            else if (state === 'COUNTDOWN') {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fbbf24';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.font = 'bold 44px sans-serif';
                ctx.strokeText(`${countdownVal}`, W / 2, H / 2);
                ctx.fillText(`${countdownVal}`, W / 2, H / 2);
            }

            // Score Display while Playing
            if (state === 'PLAYING') {
                ctx.save();
                ctx.fillStyle = 'rgba(15,23,42,.72)';
                ctx.beginPath(); ctx.roundRect(W / 2 - 35, 18, 70, 42, 13); ctx.fill();
                ctx.strokeStyle = 'rgba(251,191,36,.7)'; ctx.lineWidth = 1.3; ctx.stroke();
                ctx.textAlign = 'center'; ctx.fillStyle = '#fde68a';
                ctx.font = '800 23px Segoe UI, sans-serif';
                ctx.shadowColor = 'rgba(251,191,36,.55)'; ctx.shadowBlur = 8;
                ctx.fillText(`${score}`, W / 2, 47);
                ctx.restore();
            }

            // Game State Overlays
            if (state === 'START') {
                ctx.fillStyle = 'rgba(7, 5, 19, 0.78)';
                ctx.fillRect(0, 0, W, H);
                ctx.save();
                ctx.strokeStyle = 'rgba(251,191,36,.48)'; ctx.lineWidth = 1.2;
                ctx.shadowColor = 'rgba(251,191,36,.35)'; ctx.shadowBlur = 14;
                ctx.beginPath(); ctx.roundRect(18, 91, W-36, 300, 19); ctx.stroke();
                ctx.restore();

                ctx.textAlign = 'center';
                ctx.fillStyle = '#fff1b8';
                ctx.font = '900 23px Segoe UI, sans-serif';
                ctx.shadowColor = 'rgba(249,115,22,.95)'; ctx.shadowBlur = 19;
                ctx.fillText('RACE OF CHARIZARD', W / 2, 132); ctx.shadowBlur = 0;
                drawRainbowCreatorCredit(169, 18);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText('Tap or press Space to flap', W / 2, 225);
                ctx.fillStyle = '#dbeafe';
                ctx.font = '12px sans-serif';
                ctx.fillText('Dodge Blastoise Hydro Pumps!', W / 2, 248);

                ctx.fillStyle = '#7dd3fc';
                ctx.font = 'bold 13px Segoe UI, sans-serif';
                ctx.fillText('Meet Arceus at Score 20 & 50', W / 2, 283);

                ctx.fillStyle = '#fde68a';
                ctx.font = '700 12px Segoe UI, sans-serif';
                ctx.fillText(`Selected: ${currentMode} difficulty`, W / 2, 313);
                ctx.fillStyle = '#cbd5e1';
                ctx.font = '10px Segoe UI, sans-serif';
                ctx.fillText('Change difficulty before a run or after it ends', W / 2, 332);

                ctx.fillStyle = '#f8fafc';
                ctx.font = '600 12px Segoe UI, sans-serif';
                ctx.fillText(`Best Score: ${highScore}`, W / 2, 360);
            }
            else if (state === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, W, H);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('GAME OVER', W / 2, H / 2 - 40);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px sans-serif';
                ctx.fillText(`Score: ${score}`, W / 2, H / 2);
                ctx.fillText(`Best: ${highScore}   •   ${currentMode}`, W / 2, H / 2 + 25);

                ctx.fillStyle = '#f97316';
                ctx.font = 'bold 15px Segoe UI, sans-serif';
                ctx.fillText('Tap to Try Again', W / 2, H / 2 + 70);
            }
            else if (state === 'VICTORY') {
                ctx.fillStyle = 'rgba(10, 2, 22, 0.85)';
                ctx.fillRect(0, 0, W, H);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#fbbf24';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('YOU WON!', W / 2, H / 2 - 50);

                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 14px Segoe UI, sans-serif';
                ctx.fillText('Mega Charizard X Unlocked!', W / 2, H / 2 - 20);

                ctx.fillStyle = '#ffffff';
                ctx.font = '14px sans-serif';
                ctx.fillText(`Final Score: ${score}   •   ${currentMode}`, W / 2, H / 2 + 20);

                // Same rainbow creator signature at the end of the game.
                drawRainbowCreatorCredit(H / 2 + 52, 19);

                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 15px Segoe UI, sans-serif';
                ctx.fillText('Tap to Play Again', W / 2, H / 2 + 88);
            }
        }

        // --- MAIN LOOP ---
        function canChangeDifficulty() {
            return state === 'START' || state === 'GAMEOVER' || state === 'VICTORY';
        }

        function syncDifficultyButton() {
            diffBtn.disabled = !canChangeDifficulty();
            diffBtn.innerText = `🎚 Difficulty: ${currentMode}`;
            diffBtn.title = canChangeDifficulty()
                ? 'Change difficulty before starting or after the run ends'
                : 'Difficulty is locked during a run';
        }

        function loop() {
            update();
            syncDifficultyButton();
            render();
            requestAnimationFrame(loop);
        }

        // --- CONTROLS & EVENTS ---
        function handleAction() {
            sound.init();
            if (state === 'START' || state === 'GAMEOVER' || state === 'VICTORY') {
                state = 'PLAYING';
                score = 0;
                frame = 0;
                obstacles = [];
                waterParticles = [];
                cosmicParticles = [];
                hasCrown = false;
                isMegaEvolved = false;
                megaStoneVisible = false;
                cosmicBgAlpha = 0;
                charizard.reset();
                charizard.flap();
            } else if (state === 'PLAYING') {
                charizard.flap();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleAction();
            }
        });

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleAction();
        });

        // UI Buttons
        const soundBtn = document.getElementById('soundBtn');
        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            sound.enabled = !sound.enabled;
            soundBtn.innerText = sound.enabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
        });

        const diffBtn = document.getElementById('diffBtn');
        const modes = ['Easy', 'Medium', 'High'];
        diffBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!canChangeDifficulty()) return;
            const idx = modes.indexOf(currentMode);
            currentMode = modes[(idx + 1) % modes.length];
            cfg = MODES[currentMode];
            syncDifficultyButton();
        });

        // Start animation immediately on window load
        window.onload = function() {
            loop();
        };
    </script>
</body>
</html>
